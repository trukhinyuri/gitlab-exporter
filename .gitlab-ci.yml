include:
  - component: gitlab.com/components/container-scanning/container-scanning@~latest
  - component: gitlab.com/components/sast/sast@~latest
  - component: gitlab.com/components/secret-detection/secret-detection@~latest
  - component: gitlab.com/gitlab-org/components/gem-release/gem-release@~latest
  - template: Security/DAST.gitlab-ci.yml  # https://gitlab.com/gitlab-org/gitlab-foss/blob/master/lib/gitlab/ci/templates/Security/DAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml  # https://gitlab.com/gitlab-org/gitlab-foss/blob/master/lib/gitlab/ci/templates/Security/Dependency-Scanning.gitlab-ci.yml

variables:
  RUBY_VERSION: "3.3"

stages:
  - test
  - dast
  - deploy

default:
  image: ruby:${RUBY_VERSION}
  cache:
    key: ruby-${RUBY_VERSION}
    paths:
      - vendor
  tags:
    - gitlab-org

.before_scripts: &before_scripts
  - git config --global user.email "bot@gitlab.com"
  - git config --global user.name "Bot User"
  - bundle config set --local deployment true
  - |
     # Bundler 2.7.1 and up require Ruby 3.2 and up, so
     # to avoid https://github.com/rubygems/rubygems/issues/5380 use an
     # older Bundler version.
     case ${RUBY_VERSION} in
       "3.1")
           export BUNDLER_VERSION="2.4.20"
           ;;
     esac
  - bundle install -j $(nproc)

workflow:
  rules: &workflow_rules
    # For merge requests, create a pipeline.
    - if: '$CI_MERGE_REQUEST_IID'
    # For `master` branch, create a pipeline (this includes on schedules, pushes, merges, etc.).
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    # For tags, create a pipeline.
    - if: '$CI_COMMIT_TAG'

rspec:
  script:
    - bundle exec rspec spec -f d -c
  before_script: *before_scripts
  variables:
    # RuboCop only runs in its own job, and its transitive dependencies (e.g.
    # unicode-emoji) are not always compatible with the newest Ruby. Skip the
    # test group here so the RSpec matrix installs cleanly on every Ruby.
    BUNDLE_WITHOUT: "test"
  parallel:
    matrix:
      - RUBY_VERSION: ["3.1", "3.2", "3.3", "3.4", "4.0"]

rspec_integration:
  script:
    - bundle exec rspec spec -t integration -f d -c
  before_script: *before_scripts
  services:
    - name: redis:${REDIS_VERSION}
      alias: redis-master
    - name: bitnamilegacy/redis-sentinel:${REDIS_SENTINEL_VERSION}
      alias: redis-sentinel
      command:
        - /bin/sh
        - -c
        - |
          echo "Starting Redis Sentinel..."
          cat <<EOF > /opt/bitnami/redis-sentinel/etc/sentinel.conf
          user default off
          user ${REDIS_SENTINEL_USERNAME} on >${REDIS_SENTINEL_PASSWORD} +@all
          sentinel monitor mymaster redis-master 6379 2
          sentinel resolve-hostnames yes
          sentinel down-after-milliseconds mymaster 5000
          EOF
          redis-sentinel /opt/bitnami/redis-sentinel/etc/sentinel.conf

  variables:
    # See the rspec job: skip the test group (RuboCop) so the matrix installs
    # cleanly on every Ruby.
    BUNDLE_WITHOUT: "test"
    REDIS_URL: "redis://redis"
    REDIS_SENTINEL_URL: "redis://mymaster"
    REDIS_SENTINELS: "redis-sentinel:26379"
    REDIS_VERSION: latest
    REDIS_SENTINEL_VERSION: latest
    REDIS_SENTINEL_USERNAME: "my-sentinel-username"
    REDIS_SENTINEL_PASSWORD: "my-sentinel-password"
  parallel:
    matrix:
      - RUBY_VERSION: ["3.1", "3.2", "3.3", "3.4", "4.0"]

rubocop:
  script:
    - bundle exec rubocop
  before_script: *before_scripts

gemnasium-dependency_scanning:
  rules: *workflow_rules

secret_detection:
  rules: *workflow_rules
